name: CD

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: Build APK and create draft release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create draft release
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Uploading $APK"
          gh release create build-${{ github.run_number }} \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --draft \
            "$APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
